name: e_screen_recorder
description: "E Screen Recorder - quay màn hình, dấu đánh dấu báo trước, chỉnh sửa video."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  video_player: ^2.9.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device checks that Maestro cannot make (two-finger gestures): integration_test/.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/mosaic.frag
  assets:
    # Caption presets (schema: id, name, previewHint, style: CaptionStyle JSON). Empty until Phase 5.
    - assets/caption_templates.json
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
