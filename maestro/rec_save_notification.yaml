appId: com.huluca.escreenrecorder
name: Save - stop from the notification while the app is in the background (A2/A3)
tags:
  - p0
  - module-record
---
# Precondition: overlay + notification permissions granted.
- launchApp:
    stopApp: false
- runFlow: helpers/reset_rec_settings.yaml
- runFlow: helpers/start_recording.yaml
- launchApp:
    appId: ${OTHER_APP || 'com.android.settings'}
    stopApp: false
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN"
    timeout: 6000
    optional: true
# Our app is in the background: stop from the recording notification.
- pressKey: Home
- swipe:
    start: 50%, 1%
    end: 50%, 70%
    duration: 400
- extendedWaitUntil:
    visible: "Đang quay màn hình"
    timeout: 8000
# ColorOS puts a recording in "silent notifications", collapsed: open it with its arrow.
- runFlow:
    when:
      notVisible: "Dừng"
    commands:
      - tapOn:
          id: "android:id/expand_button"
          rightOf: "E Screen Recorder"
- extendedWaitUntil:
    visible: "Dừng"
    timeout: 5000
- takeScreenshot: artifacts/rec_save_notif_shade
- tapOn:
    text: "Dừng"
    below: "Đang quay màn hình"
- pressKey: Home
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN"
    timeout: 5000
    optional: true
# Back in the app (not cold): the saved recording is announced and the library is fresh, no pull needed.
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- extendedWaitUntil:
    visible: "Đã lưu ESR_.*|Quay xong rồi"
    timeout: 40000
- takeScreenshot: artifacts/rec_save_notif_result
- runFlow:
    when:
      visible:
        id: "result_back"
    commands:
      - tapOn:
          id: "result_back"
- tapOn:
    text: "Thư viện.*"
- assertVisible: "ESR_.*"
- takeScreenshot: artifacts/rec_save_notif_library
