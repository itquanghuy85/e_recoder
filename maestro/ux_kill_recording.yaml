appId: com.huluca.escreenrecorder
name: Kill while recording - start, tap two keys, then wait (the script kills the app)
tags:
  - p1
  - module-ux
---
# scripts/qa/ux_kill_recording.ps1 kills the app once "5" was tapped, while it is still recording.
- launchApp:
    stopApp: true
- runFlow:
    when:
      visible: "Bỏ qua"
    commands:
      - tapOn: "Bỏ qua"
- tapOn: "Bắt đầu quay"
- runFlow:
    when:
      visible: "Sẵn sàng quay chưa."
    commands:
      - tapOn: "Sẵn sàng quay"
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "Bắt đầu quay"
          commands:
            - tapOn: "Bắt đầu quay"
      - runFlow:
          when:
            visible: "Trong khi dùng ứng dụng"
          commands:
            - tapOn: "Trong khi dùng ứng dụng"
      - extendedWaitUntil:
          visible: "Bắt đầu ngay|Chia sẻ màn hình|Dừng quay"
          timeout: 8000
- runFlow:
    when:
      visible: "Bắt đầu ngay|Chia sẻ màn hình"
    commands:
      - tapOn: "Bắt đầu ngay|Chia sẻ màn hình"
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 4000
    optional: true
- launchApp:
    appId: com.sec.android.app.popupcalculator
    stopApp: false
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "7"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "5"
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 60000
    optional: true
