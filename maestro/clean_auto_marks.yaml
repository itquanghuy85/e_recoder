appId: com.huluca.escreenrecorder
name: Clean + automatic marks - touches in another app become marks in the editor (B1)
tags:
  - p0
  - module-marker
  - module-editor
---
# Precondition: overlay permission granted (helpers/grant_overlay.yaml).
- launchApp:
    stopApp: false
- runFlow: helpers/reset_rec_settings.yaml
- runFlow:
    file: helpers/set_mark_mode.yaml
    env:
      MODE: mode_clean
- runFlow: helpers/start_recording.yaml
# Something harmless to touch: the calculator's keys (Settings rows can open account pages).
- launchApp:
    appId: ${OTHER_APP || 'com.coloros.calculator'}
    stopApp: false
- waitForAnimationToEnd:
    timeout: 3000
# Clean: nothing of ours on screen.
- assertNotVisible: "Bật chế độ chỉ điểm"
# Four touches, ~2 s apart, on keys 4, 5, 3, 2 (CPH2325 layout; between the rows nothing reacts).
- tapOn:
    point: 14%, 65%
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN"
    timeout: 2000
    optional: true
- tapOn:
    point: 38%, 65%
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN"
    timeout: 2000
    optional: true
- tapOn:
    point: 62%, 76%
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN"
    timeout: 2000
    optional: true
- tapOn:
    point: 38%, 76%
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN"
    timeout: 2000
    optional: true
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- tapOn: "Dừng quay"
- runFlow: helpers/after_stop.yaml
- tapOn:
    text: "Thư viện.*"
- tapOn:
    text: ".*ESR_.*"
    index: 0
# The first tap can land while the player page is still sliding in: retry until the editor answers.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "player_edit"
      - extendedWaitUntil:
          visible:
            id: "editor_play|editor_waiting_marks"
          timeout: 8000
- extendedWaitUntil:
    visible:
      id: "editor_play"
    # the editor waits for the automatic marks (finding each touch's place) before it opens
    timeout: 240000
- takeScreenshot: artifacts/clean_auto_editor
# The draft has marks (count shown in the timeline's description).
- assertVisible: "Dòng thời gian: .* đoạn, [1-9][0-9]* dấu.*"
- runFlow: helpers/ensure_tools_open.yaml
- runFlow:
    when:
      notVisible:
        id: "tool_auto"
    commands:
      - tapOn:
          id: "editor_mode_advanced"
- tapOn:
    id: "tool_auto"
# The tool panel scrolls on its own (below the preview): swipe inside it.
- repeat:
    times: 25
    while:
      notVisible:
        id: "auto_marks_summary"
    commands:
      - swipe:
          start: 50%, 92%
          end: 50%, 84%
          duration: 500
- assertVisible: "Nghe [1-9][0-9]* lần chạm · [1-9][0-9]* dấu.*"
- takeScreenshot: artifacts/clean_auto_review
