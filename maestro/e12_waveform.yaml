appId: com.huluca.escreenrecorder
name: E12 editor - the timeline draws the sound of the clip
tags:
  - p0
  - module-editor
---
# The profile records the microphone: speak or play something while this runs for a clear waveform.
- runFlow: helpers/record_clip.yaml
- tapOn:
    text: "Thư viện.*"
- tapOn:
    text: ".*ESR_.*"
    index: 0
- tapOn:
    id: "player_edit"
- extendedWaitUntil:
    visible:
      id: "editor_play"
    timeout: 30000
- runFlow: helpers/ensure_tools_open.yaml
# The waveform is read in the background: give it a moment, then look at the timeline.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artifacts/e12_waveform
