appId: com.huluca.escreenrecorder
name: E13 pick a video from the phone, opens in the editor, plays, portrait-by-flag stays portrait
tags:
  - p0
  - module-editor
---
# Needs esr_rot.mp4 in Download: a 1280x720 file with a 90 degree turn flag (shown portrait).
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- tapOn:
    text: "Thư viện.*"
- tapOn:
    id: "library_pick_video"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible: "esr_rot.mp4"
    commands:
      - tapOn: "Hiển thị gốc"
      - tapOn: "Tải xuống"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn: "esr_rot.mp4"
- extendedWaitUntil:
    visible:
      id: "editor_play"
    timeout: 20000
- takeScreenshot: artifacts/e13_opened
# plays and pauses, ten times
- repeat:
    times: 10
    commands:
      - tapOn:
          id: "editor_play"
      - waitForAnimationToEnd:
          timeout: 600
- takeScreenshot: artifacts/e13_after_play
- assertVisible:
    id: "editor_play"
