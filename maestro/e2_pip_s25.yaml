appId: com.huluca.escreenrecorder
name: E6 picture-in-picture video (Samsung picker)
tags:
  - p0
  - module-editor
---
- runFlow: helpers/open_edit.yaml
- runFlow: helpers/editor_advanced.yaml
- tapOn:
    id: "tool_overlay"
- tapOn:
    id: "add_pip"
- waitForAnimationToEnd:
    timeout: 3000
# The picker remembers the last folder: open Downloads only when the file is not shown, then pick it by name
# (fixed screen points differ between phones and between runs).
- runFlow:
    when:
      notVisible: "esr_pip.mp4"
    commands:
      - tapOn:
          point: 7%, 7%
      - waitForAnimationToEnd
      - tapOn: "Tệp đã tải xuống|Tải xuống|Downloads"
      - waitForAnimationToEnd
- tapOn: "esr_pip.mp4"
- extendedWaitUntil:
    visible:
      id: "editor_play"
    timeout: 20000
- tapOn:
    id: "editor_export"
- tapOn:
    id: "quality_p480"
- tapOn:
    id: "export_start"
- extendedWaitUntil:
    visible:
      id: "export_view"
    timeout: 300000
