appId: com.huluca.escreenrecorder
name: G6 clean mode - nothing on screen, markers land in the editor
tags:
  - p0
  - module-marker
  - module-editor
---
- launchApp:
    stopApp: false
- runFlow: helpers/reset_rec_settings.yaml
- runFlow:
    file: helpers/set_mark_mode.yaml
    env:
      MODE: mode_clean
      CORNER: corner_2
- runFlow: helpers/start_recording.yaml
- launchApp:
    appId: ${OTHER_APP || 'com.android.settings'}
    stopApp: false
- extendedWaitUntil:
    visible: "Vùng đánh dấu ẩn"
    timeout: 15000
# Nothing visible is on screen: no dot, no pill, no tray.
- assertNotVisible: "Bật chế độ chỉ điểm"
- assertNotVisible: "Công cụ mũi tên"
- takeScreenshot: artifacts/g6_clean_idle
# Arm with the hidden corner, then touch the target: the touch is swallowed (no dialog opens).
- tapOn: "Vùng đánh dấu ẩn"
- tapOn:
    point: 50%, 40%
- waitForAnimationToEnd:
    timeout: 1200
- assertNotVisible: "Đồng ý và tiếp tục"
- takeScreenshot: artifacts/g6_clean_marked
# The real press now goes through to the app underneath.
- tapOn:
    point: 50%, 40%
# Only the default other app (Settings) opens a dialog from that row; a custom OTHER_APP just gets the press.
- runFlow:
    when:
      true: ${OTHER_APP == null}
    commands:
      - extendedWaitUntil:
          visible: "Đồng ý và tiếp tục"
          timeout: 5000
- back
# Second marker: drag the marker with the finger tool; third one after another pause.
- tapOn: "Vùng đánh dấu ẩn"
- tapOn:
    point: 30%, 62%
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Vùng đánh dấu ẩn"
- tapOn:
    point: 70%, 75%
- waitForAnimationToEnd:
    timeout: 1500
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- tapOn: "Dừng quay"
- extendedWaitUntil:
    visible: "Đã lưu ESR_.*"
    timeout: 25000
# The three markers are waiting in the editor, with the automatic zoom.
- tapOn:
    text: "Thư viện.*"
- tapOn:
    text: ".*ESR_.*"
    index: 0
- tapOn:
    id: "player_edit"
- extendedWaitUntil:
    visible:
      id: "editor_play"
    timeout: 30000
- assertVisible: "Dòng thời gian: 1 đoạn, 3 dấu.*"
- takeScreenshot: artifacts/g6_editor_draft
