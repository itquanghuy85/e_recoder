appId: com.huluca.escreenrecorder
name: Preset - plain 1080p, no marks, record Settings, export without editing
tags:
  - preset
---
- launchApp:
    stopApp: true
- runFlow:
    when:
      visible: "Bỏ qua"
    commands:
      - tapOn: "Bỏ qua"
- runFlow: helpers/start_recording.yaml
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_PRESET"
    timeout: 4000
    optional: true
- launchApp:
    appId: com.android.settings
    stopApp: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: plain_1_settings
- tapOn: "Kết nối"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: plain_2_connections
- launchApp:
    appId: com.android.settings
    stopApp: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Âm thanh và rung"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: plain_3_sound
- scroll
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: plain_4_scrolled
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- extendedWaitUntil:
    visible: "Dừng quay"
    timeout: 15000
- tapOn: "Dừng quay"
- extendedWaitUntil:
    visible: "Quay xong rồi"
    timeout: 40000
- extendedWaitUntil:
    notVisible: "Đang dựng tự động.*"
    timeout: 120000
- takeScreenshot: plain_5_result
- tapOn: "Xuất ngay"
- extendedWaitUntil:
    visible: "Đã xuất: .*"
    timeout: 120000
- takeScreenshot: plain_6_exported
