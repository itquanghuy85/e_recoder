appId: com.huluca.escreenrecorder
name: E14 picture-in-picture of a portrait-by-flag video keeps its shape in the export
tags:
  - p0
  - module-editor
---
# Needs esr_rot.mp4 in Download (1280x720 with a 90 degree turn flag). It is both the main video and the PiP.
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- tapOn:
    text: "Thư viện.*"
- tapOn:
    id: "library_pick_video"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible: "esr_rot.mp4"
    commands:
      - tapOn: "Hiển thị gốc"
      - tapOn: "Tải xuống"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn: "esr_rot.mp4"
- extendedWaitUntil:
    visible:
      id: "editor_play"
    timeout: 20000
- tapOn:
    id: "tool_overlay"
- tapOn:
    id: "add_pip"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible: "esr_rot.mp4"
    commands:
      - tapOn: "Hiển thị gốc"
      - tapOn: "Tải xuống"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn: "esr_rot.mp4"
- extendedWaitUntil:
    visible:
      id: "editor_play"
    timeout: 20000
- takeScreenshot: artifacts/e14_pip_preview
- tapOn:
    id: "editor_export"
- tapOn:
    id: "quality_p480"
- tapOn:
    id: "export_start"
- extendedWaitUntil:
    visible:
      id: "export_view"
    timeout: 240000
- takeScreenshot: artifacts/e14_exported
