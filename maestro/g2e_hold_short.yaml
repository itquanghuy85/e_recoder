appId: com.huluca.escreenrecorder
name: G2e live marker with the shortest effect time - finger, then an arrow, both gone quickly
tags:
  - p0
  - module-marker
---
# Check the result with: python scripts/qa/marker_lifetime.py <the new recording> 0.5 0.4 0.6 0.45
- launchApp:
    stopApp: false
- runFlow: helpers/reset_rec_settings.yaml
- runFlow:
    file: helpers/set_mark_mode.yaml
    env:
      MODE: mode_dot
      CORNER: corner_2
- runFlow: helpers/set_marker_hold_min.yaml
- runFlow: helpers/start_recording.yaml
- launchApp:
    appId: ${OTHER_APP || 'com.android.settings'}
    stopApp: false
- extendedWaitUntil:
    visible: "Bật chế độ chỉ điểm"
    timeout: 15000
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 3000
    optional: true
# Finger at (50%, 40%).
- tapOn: "Bật chế độ chỉ điểm"
- tapOn:
    point: 50%, 40%
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 5000
    optional: true
# Another kind: the arrow tool, dragged from (80%, 55%) to (60%, 42%).
- longPressOn: "Bật chế độ chỉ điểm"
- tapOn: "Chọn dấu.*"
- tapOn: "Công cụ mũi tên"
- tapOn: "Xong chọn dấu"
- tapOn:
    text: "Đã quay.*"
- tapOn: "Bật chế độ chỉ điểm"
- swipe:
    start: 80%, 55%
    end: 60%, 42%
    duration: 400
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 5000
    optional: true
- longPressOn: "Bật chế độ chỉ điểm"
- tapOn: "Dừng quay"
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- extendedWaitUntil:
    visible: "Đã lưu ESR_.*"
    timeout: 25000
