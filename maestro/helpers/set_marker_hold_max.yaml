appId: com.huluca.escreenrecorder
name: Helper - set the marker effect time to its longest (10 s)
tags:
  - helper
---
# Tutorial purpose, marks by hand, More options. Ends on the Record tab. (The swipe direction cannot come
# from an env variable.)
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- tapOn:
    text: 'Quay\sTab.*'
- tapOn:
    id: "purpose_tutorial"
- tapOn:
    id: "quick_marks_live"
- scrollUntilVisible:
    element:
      id: "record_more"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "record_more"
- scrollUntilVisible:
    element:
      id: "more_hold"
    direction: DOWN
    timeout: 15000
- swipe:
    from:
      id: "more_hold"
    direction: RIGHT
    duration: 800
- tapOn:
    id: "record_more"
