appId: com.huluca.escreenrecorder
name: Helper - set the marker effect time to its shortest (0.5 s)
tags:
  - helper
---
# Tutorial purpose, marks by hand: the time slider is among its main options. Ends on the Record tab.
# (The swipe direction cannot come from an env variable.)
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- tapOn:
    text: 'Quay\sTab.*'
- tapOn:
    id: "purpose_tutorial"
- tapOn:
    id: "quick_marks_live"
- scrollUntilVisible:
    element:
      id: "quick_hold"
    direction: DOWN
    timeout: 15000
- swipe:
    from:
      id: "quick_hold"
    direction: LEFT
    duration: 800
