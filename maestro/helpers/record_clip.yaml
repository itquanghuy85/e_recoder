appId: com.huluca.escreenrecorder
name: Helper - record a short clip of the Settings app (about 12 s)
tags:
  - helper
---
# Leaves a fresh, known-length recording at the top of the library.
- runFlow: reset_rec_settings.yaml
- runFlow: start_recording.yaml
- launchApp:
    appId: ${OTHER_APP || 'com.android.settings'}
    stopApp: false
- extendedWaitUntil:
    visible: "Bật chế độ chỉ điểm"
    timeout: 15000
- scroll
- scroll
- scroll
- scroll
- scroll
- scroll
- longPressOn: "Bật chế độ chỉ điểm"
- tapOn: "Dừng quay"
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
# After a recording the app shows what came out (Export now / Edit more / Record again): go back to
# the recorder, the flows go on from its tabs.
- extendedWaitUntil:
    visible: "Đã lưu ESR_.*|Quay xong rồi"
    timeout: 25000
- runFlow:
    when:
      visible:
        id: "result_back"
    commands:
      - tapOn:
          id: "result_back"
