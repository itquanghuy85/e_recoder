appId: com.huluca.escreenrecorder
name: Helper - choose how marks are made (tutorial purpose, on the Record tab)
tags:
  - helper
---
# env: MODE = mode_dot (marks by hand while recording) | mode_clean (clean recording, marks added after).
# CORNER is no longer used: the corner of the dot is not a setting any more (it stays bottom-left).
# Ends on the Record tab.
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- tapOn:
    text: 'Quay\sTab.*'
- tapOn:
    id: "purpose_tutorial"
- runFlow:
    when:
      true: ${MODE == 'mode_clean'}
    commands:
      - tapOn:
          id: "quick_marks_auto"
- runFlow:
    when:
      true: ${MODE != 'mode_clean'}
    commands:
      - tapOn:
          id: "quick_marks_live"
