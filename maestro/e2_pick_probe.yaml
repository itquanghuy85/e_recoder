appId: com.huluca.escreenrecorder
name: E2 probe - pick a picture through the system picker
tags:
  - p1
  - module-editor
---
- runFlow: helpers/open_edit.yaml
- runFlow: helpers/editor_advanced.yaml
- tapOn:
    id: "tool_overlay"
- tapOn:
    id: "add_image"
- waitForAnimationToEnd:
    timeout: 3000
# The picker remembers the last folder: open Downloads only when the file is not shown, then pick it by name
# (fixed screen points differ between phones and between runs).
- runFlow:
    when:
      notVisible: "esr_pic.png"
    commands:
      - tapOn:
          point: 7%, 7%
      - waitForAnimationToEnd
      - tapOn: "Tệp đã tải xuống|Tải xuống|Downloads"
      - waitForAnimationToEnd
- tapOn: "esr_pic.png"
- extendedWaitUntil:
    visible:
      id: "editor_play"
    timeout: 10000
- takeScreenshot: artifacts/e2_image_picked
