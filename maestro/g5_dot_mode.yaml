appId: com.huluca.escreenrecorder
name: G5 dot mode - one small dot, tap it, touch the target, then press for real
tags:
  - p0
  - module-marker
---
- launchApp:
    stopApp: false
- runFlow: helpers/reset_rec_settings.yaml
- runFlow:
    file: helpers/set_mark_mode.yaml
    env:
      MODE: mode_dot
      CORNER: corner_2
- runFlow: helpers/start_recording.yaml
- launchApp:
    appId: ${OTHER_APP || 'com.android.settings'}
    stopApp: false
# Only the small dot is on screen: no pill, no timer, no tray.
- extendedWaitUntil:
    visible: "Bật chế độ chỉ điểm"
    timeout: 15000
- assertNotVisible: "Dừng quay"
- assertNotVisible: "Công cụ mũi tên"
- takeScreenshot: artifacts/g5_dot_idle
# Tap the dot, touch the spot, the dot goes back to idle by itself.
- tapOn: "Bật chế độ chỉ điểm"
- assertVisible: "Tắt chế độ chỉ điểm"
- tapOn:
    point: 50%, 40%
- takeScreenshot: artifacts/g5_dot_placed
- extendedWaitUntil:
    visible: "Bật chế độ chỉ điểm"
    timeout: 4000
# The next tap reaches the app underneath (a Settings row opens).
- tapOn:
    point: 50%, 40%
- waitForAnimationToEnd:
    timeout: 1500
- back
# Long press: the control pill opens; the tool picker pauses the recording while it is open.
- longPressOn: "Bật chế độ chỉ điểm"
- assertVisible: "Dừng quay"
- tapOn: "Chọn dấu.*"
- assertVisible: "Công cụ mũi tên"
- assertVisible: "Tiếp tục"
- takeScreenshot: artifacts/g5_dot_picker
- tapOn: "Công cụ mũi tên"
- tapOn: "Xong chọn dấu"
- assertVisible: "Tạm dừng"
# Dismiss the pill by tapping it, then place the arrow with the dot.
- tapOn:
    text: "Đã quay.*"
- assertNotVisible: "Dừng quay"
- tapOn: "Bật chế độ chỉ điểm"
- swipe:
    start: 80%, 55%
    end: 60%, 42%
    duration: 400
- waitForAnimationToEnd:
    timeout: 1800
- takeScreenshot: artifacts/g5_dot_arrow
- longPressOn: "Bật chế độ chỉ điểm"
- tapOn: "Dừng quay"
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- extendedWaitUntil:
    visible: "Đã lưu ESR_.*"
    timeout: 25000
