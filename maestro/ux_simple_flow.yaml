appId: com.huluca.escreenrecorder
name: Simple UX - first run asks the purpose, one big button, result screen, export
tags:
  - p1
  - module-ux
---
# Env: PURPOSE = tutorial|game|plain, BUTTON = the big button's text for it (ux_flow.ps1 sets both).
# Needs the first-run state (no "onboarded" / "purpose" in the settings): scripts/qa/ux_flow.ps1 sets it up
# and puts the phone's own settings back afterwards. Choose "tutorial", record 5 s, stop, look at the result
# screen, open the editor and come back, export. The file is checked by the script.
- launchApp:
    stopApp: true
- runFlow:
    when:
      visible: "Bỏ qua"
    commands:
      - tapOn: "Bỏ qua"
- assertVisible: "Bạn muốn làm gì?"
- assertVisible:
    id: "purpose_tutorial"
- assertVisible:
    id: "purpose_game"
- assertVisible:
    id: "purpose_plain"
- takeScreenshot: ux_1_purpose
- tapOn:
    id: "purpose_${PURPOSE}"
- assertVisible: "${BUTTON}"
- takeScreenshot: ux_2_record_screen
# Quick options: ticks right on the record screen, no need to open the settings.
- scrollUntilVisible:
    element:
      id: "quick_mic"
- assertVisible:
    id: "quick_mic"
- assertVisible:
    id: "quick_system"
- tapOn:
    id: "quick_system"
- takeScreenshot: ux_2a_quick_options
- scrollUntilVisible:
    element:
      id: "record_advanced"
- assertVisible:
    id: "record_advanced"
- scrollUntilVisible:
    element: "${BUTTON}"
    direction: UP
- tapOn: "${BUTTON}"
# A missing permission is listed on its own screen; with everything granted this block is skipped.
- runFlow:
    when:
      visible: "Sẵn sàng quay chưa."
    commands:
      - takeScreenshot: ux_2b_ready_check
      - tapOn: "Sẵn sàng quay"
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "${BUTTON}"
          commands:
            - tapOn: "${BUTTON}"
      - runFlow:
          when:
            visible: "Trong khi dùng ứng dụng"
          commands:
            - tapOn: "Trong khi dùng ứng dụng"
      - extendedWaitUntil:
          visible: "Bắt đầu ngay|Chia sẻ màn hình|Dừng quay"
          timeout: 8000
- runFlow:
    when:
      visible: "Bắt đầu ngay|Chia sẻ màn hình"
    commands:
      - tapOn: "Bắt đầu ngay|Chia sẻ màn hình"
# Recording starts and the app steps aside; record about 5 seconds, then come back and stop.
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 5000
    optional: true
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- extendedWaitUntil:
    visible: "Dừng quay"
    timeout: 15000
- tapOn: "Dừng quay"
- extendedWaitUntil:
    visible: "Quay xong rồi"
    timeout: 40000
- assertVisible: "Xuất ngay"
- assertVisible: "Sửa thêm"
- assertVisible: "Quay lại"
- takeScreenshot: ux_3_result
- tapOn: "Sửa thêm"
- extendedWaitUntil:
    visible:
      id: "editor_play"
    timeout: 30000
- takeScreenshot: ux_4_editor
# Batch change of marks: add two arrows, turn them all into tap marks at once, pick many clips.
- tapOn:
    id: "tool_marker"
- tapOn:
    id: "add_marker_arrow"
- tapOn:
    id: "tool_marker"
- tapOn:
    id: "add_marker_arrow"
- takeScreenshot: ux_4a0_markers_added
# The batch section is a folded row at the top of the marker panel: open it.
- tapOn:
    id: "marker_batch"
- takeScreenshot: ux_4a1_batch_open
- assertVisible: "Áp cho tất cả 2 dấu"
- swipe:
    start: 50%,92%
    end: 50%,78%
- takeScreenshot: ux_4a2_after_swipe
- tapOn:
    id: "batch_kind_finger"
- takeScreenshot: ux_4a_batch
- tapOn:
    id: "timeline_multi"
- takeScreenshot: ux_4b_multi_on
- assertVisible:
    id: "timeline_select_all"
- tapOn:
    id: "timeline_select_all"
- takeScreenshot: ux_4c_multi
- back
- extendedWaitUntil:
    visible: "Xuất ngay"
    timeout: 10000
- assertVisible:
    id: "result_quality_original"
- tapOn:
    id: "result_quality_p720"
- takeScreenshot: ux_4b_quality
- tapOn: "Xuất ngay"
- extendedWaitUntil:
    visible: "Đã xuất: .*"
    timeout: 120000
- takeScreenshot: ux_5_exported
- tapOn: "Quay lại"
- assertVisible: "${BUTTON}"
- takeScreenshot: ux_6_back_to_record
