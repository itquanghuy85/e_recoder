appId: com.huluca.escreenrecorder
name: G2e live marker with the longest effect time - it follows to another page, then fades by itself
tags:
  - p0
  - module-marker
---
# Check the result with: python scripts/qa/marker_lifetime.py <the new recording> 0.5 0.4
- launchApp:
    stopApp: false
- runFlow: helpers/reset_rec_settings.yaml
- runFlow:
    file: helpers/set_mark_mode.yaml
    env:
      MODE: mode_dot
      CORNER: corner_2
- runFlow: helpers/set_marker_hold_max.yaml
- runFlow: helpers/start_recording.yaml
- launchApp:
    appId: ${OTHER_APP || 'com.android.settings'}
    stopApp: false
- extendedWaitUntil:
    visible: "Bật chế độ chỉ điểm"
    timeout: 15000
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 3000
    optional: true
- tapOn: "Bật chế độ chỉ điểm"
- tapOn:
    point: 50%, 40%
# Three seconds later leave for the home screen: the marker is a window over everything.
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 3000
    optional: true
- pressKey: Home
# Longer than the effect time (10 s from placing): by then the marker has faded on its own.
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 10000
    optional: true
- longPressOn: "Bật chế độ chỉ điểm"
- tapOn: "Dừng quay"
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- extendedWaitUntil:
    visible: "Đã lưu ESR_.*"
    timeout: 25000
