appId: com.huluca.escreenrecorder
name: E4 music and voice-over on a short edit, then export
tags:
  - p0
  - module-editor
---
# Needs esr_tone.m4a in Download (scripts/qa/push_test_media.ps1) and a short edit in the library.
- runFlow: helpers/open_edit.yaml
- tapOn:
    id: "tool_audio"
# The panel is short now (the preview gets the room): the music button is below the volume sliders.
- runFlow: helpers/scroll_panel.yaml
- runFlow: helpers/scroll_panel.yaml
- tapOn:
    id: "audio_add_music"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/e4_picker
# Pick the tone by its name (it is in Recent, or in Downloads via the side menu), not by position.
- runFlow:
    when:
      notVisible: "esr_tone.m4a"
    commands:
      - tapOn: "Hiển thị gốc"
      - tapOn: "Tải xuống"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn: "esr_tone.m4a"
- extendedWaitUntil:
    visible:
      id: "editor_play"
    timeout: 10000
- takeScreenshot: artifacts/e4_music
# "Record voice" sits under "add music": drag the panel (not the whole screen) a little more.
# A track is selected now and its own controls fill the panel: tap the empty timeline (left of the
# clip) to deselect, then the add buttons are back under the segment controls.
- tapOn:
    point: 12%, 50%
- runFlow: helpers/scroll_panel_half.yaml
- tapOn:
    id: "audio_voice"
- runFlow:
    when:
      visible: "Trong khi dùng ứng dụng"
    commands:
      - tapOn: "Trong khi dùng ứng dụng"
- runFlow:
    when:
      visible: "Cho phép"
    commands:
      - tapOn: "Cho phép"
- waitForAnimationToEnd:
    timeout: 3500
- tapOn:
    id: "audio_voice"
- takeScreenshot: artifacts/e4_voice
- tapOn:
    id: "editor_export"
- tapOn:
    id: "quality_p480"
- tapOn:
    id: "export_start"
- extendedWaitUntil:
    visible:
      id: "export_view"
    timeout: 300000
