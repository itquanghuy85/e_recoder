appId: com.huluca.escreenrecorder
name: E4 music and voice-over on a short edit, then export
tags:
  - p0
  - module-editor
---
# Needs esr_tone.m4a in Download (scripts/qa/push_test_media.ps1) and a short edit in the library.
- runFlow: helpers/open_edit.yaml
- tapOn:
    id: "tool_audio"
- runFlow: helpers/scroll_panel.yaml
- tapOn:
    id: "audio_add_music"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/e4_picker
- tapOn:
    point: 7%, 7%
- waitForAnimationToEnd
- tapOn:
    point: 22%, 19%
- waitForAnimationToEnd
- tapOn:
    point: 72%, 44%
- extendedWaitUntil:
    visible:
      id: "editor_play"
    timeout: 10000
- takeScreenshot: artifacts/e4_music
- tapOn:
    id: "audio_voice"
- runFlow:
    when:
      visible: "Trong khi dùng ứng dụng"
    commands:
      - tapOn: "Trong khi dùng ứng dụng"
- runFlow:
    when:
      visible: "Cho phép"
    commands:
      - tapOn: "Cho phép"
- waitForAnimationToEnd:
    timeout: 3500
- tapOn:
    id: "audio_voice"
- takeScreenshot: artifacts/e4_voice
- tapOn:
    id: "editor_export"
- tapOn:
    id: "quality_p480"
- tapOn:
    id: "export_start"
- extendedWaitUntil:
    visible:
      id: "export_view"
    timeout: 300000
