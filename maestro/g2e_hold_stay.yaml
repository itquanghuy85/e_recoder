appId: com.huluca.escreenrecorder
name: G2e live marker while still in marking mode (auto exit off) - it still fades by itself
tags:
  - p0
  - module-marker
---
# Check the result with: python scripts/qa/marker_lifetime.py <the new recording> 0.5 0.4
- launchApp:
    stopApp: false
- runFlow: helpers/reset_rec_settings.yaml
- runFlow:
    file: helpers/set_mark_mode.yaml
    env:
      MODE: mode_dot
      CORNER: corner_2
- runFlow: helpers/set_marker_hold_min.yaml
# Switch "leave point mode after placing" OFF (it is on by default).
- tapOn:
    text: "Cài đặt.*"
- tapOn:
    id: "settings_markers"
- scrollUntilVisible:
    element: "Tự thoát chế độ chỉ điểm.*"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "marker_exit_delay"
    commands:
      - tapOn: "Tự thoát chế độ chỉ điểm.*"
- back
- tapOn:
    text: "Quay.*"
- runFlow: helpers/start_recording.yaml
- launchApp:
    appId: ${OTHER_APP || 'com.android.settings'}
    stopApp: false
- extendedWaitUntil:
    visible: "Bật chế độ chỉ điểm"
    timeout: 15000
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 3000
    optional: true
# Point mode stays ON after placing: the marker must still go after its (shortest) time.
- tapOn: "Bật chế độ chỉ điểm"
- tapOn:
    point: 50%, 40%
- extendedWaitUntil:
    visible: "NEVER_ON_SCREEN_STILL_PAGE"
    timeout: 6000
    optional: true
- assertVisible: "Tắt chế độ chỉ điểm"
- tapOn: "Tắt chế độ chỉ điểm"
- longPressOn: "Bật chế độ chỉ điểm"
- tapOn: "Dừng quay"
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- extendedWaitUntil:
    visible: "Đã lưu ESR_.*"
    timeout: 25000
# Put the switch back on for the other flows.
- tapOn:
    text: "Cài đặt.*"
- tapOn:
    id: "settings_markers"
- scrollUntilVisible:
    element: "Tự thoát chế độ chỉ điểm.*"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      notVisible:
        id: "marker_exit_delay"
    commands:
      - tapOn: "Tự thoát chế độ chỉ điểm.*"
