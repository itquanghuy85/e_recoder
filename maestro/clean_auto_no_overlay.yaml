appId: com.huluca.escreenrecorder
name: Clean + automatic without the overlay permission - asks first, does not record (B2)
tags:
  - module-marker
---
# Precondition (by adb before the flow): appops set com.huluca.escreenrecorder SYSTEM_ALERT_WINDOW deny
- launchApp:
    stopApp: false
- runFlow:
    file: helpers/set_mark_mode.yaml
    env:
      MODE: mode_clean
- tapOn: "Bắt đầu quay"
# The overlay settings page opens instead of the screen-capture consent.
- extendedWaitUntil:
    notVisible: "Bắt đầu ngay|Chia sẻ màn hình"
    timeout: 3000
- takeScreenshot: artifacts/clean_no_overlay
- assertNotVisible: "Dừng quay"
