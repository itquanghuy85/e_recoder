appId: com.huluca.escreenrecorder
name: G1 record without floating bar or countdown, system audio, stop from app
tags:
  - p1
  - module-record
---
- launchApp:
    stopApp: false
- runFlow: helpers/reset_rec_settings.yaml
- tapOn:
    id: "purpose_plain"
- tapOn:
    id: "quick_res_p720"
- tapOn:
    id: "quick_system"
- scrollUntilVisible:
    element:
      id: "record_more"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "record_more"
- scrollUntilVisible:
    element:
      id: "more_quality_low"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "more_quality_low"
- tapOn:
    id: "more_countdown_0"
- tapOn:
    id: "more_floating"
- runFlow: helpers/start_recording.yaml
- launchApp:
    appId: ${OTHER_APP || 'com.android.settings'}
    stopApp: false
- scroll
- scroll
- scroll
# Back in the app the live view shows the timer and the stop button.
- launchApp:
    appId: com.huluca.escreenrecorder
    stopApp: false
- assertVisible: "Đang quay"
- takeScreenshot: artifacts/g1_live_view
- tapOn: "Dừng quay"
- runFlow: helpers/after_stop.yaml
- runFlow: helpers/reset_rec_settings.yaml
